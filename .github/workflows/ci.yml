name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -cover ./...

  vuln:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Fails only on vulnerabilities reachable from this module's code
      # (govulncheck's default symbol-level analysis); purely informational
      # module-level findings do not fail the job.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # gofmt ships with the Go toolchain, so this job installs nothing. The
      # whole tree is already gofmt-clean, which lets this gate every file
      # rather than only the lines a change touched.
      #
      # `go vet` runs in the test job above and catches the correctness issues
      # gofmt cannot see.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            echo
            gofmt -d .
            echo "Run 'gofmt -w .' or 'task format' to fix."
            exit 1
          fi
          echo "All files are gofmt-formatted."
