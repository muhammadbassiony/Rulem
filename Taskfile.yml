version: "3"

tasks:
  build:
    desc: Build the rulem CLI binary
    cmds:
      - go build -o rulem ./cmd/rulem

  run:
    desc: Run the rulem CLI interactively
    cmds:
      - go run ./cmd/rulem --debug {{.CLI_ARGS}}

  test:
    desc: Run all unit tests
    cmds:
      - go test --cover ./...

  lint:
    desc: Check formatting with gofmt and run go vet (no external tools)
    cmds:
      - |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "These files are not gofmt-formatted:"
          echo "$unformatted"
          echo "Run 'task format' to fix."
          exit 1
        fi
        echo "All files are gofmt-formatted."
      - go vet ./...

  vuln:
    desc: Scan for known vulnerabilities with govulncheck
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  clean:
    desc: Remove built binaries and temporary files
    cmds:
      - rm -f rulem

  format:
    desc: Format code with gofmt
    cmds:
      - gofmt -w .

  mcp:
    desc: Run the MCP server (Model Context Protocol) with debug enabled
    cmds:
      - go run ./cmd/rulem --debug mcp

  vhs-gen:
    desc: Regenerate all demo GIFs (requires vhs, ttyd and ffmpeg on PATH)
    cmds:
      - ./demo/setup-demo-env.sh
      - vhs demo/main-demo.tape
      # - vhs demo/import-demo.tape
      # - vhs demo/settings-demo.tape
